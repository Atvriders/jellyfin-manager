<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jellyfin Scan Media Library</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #101010;
    --surface: #1c1c1c;
    --border:  #2e2e2e;
    --accent:  #00a4dc;
    --green:   #4caf7d;
    --amber:   #d9a441;
    --red:     #e05260;
    --text:    #e8e8e8;
    --muted:   #888;
    --radius:  12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    padding: 2.5rem 1rem;
  }

  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2.5rem 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.75rem;
    min-width: 320px;
  }

  #scan-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    padding: 0.75rem 2rem;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    width: 100%;
  }
  #scan-btn:hover:not(:disabled) { opacity: 0.88; }
  #scan-btn:active:not(:disabled) { transform: scale(0.97); }
  #scan-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Status bar */
  #status-bar-wrap {
    width: 100%;
    display: none;
    flex-direction: column;
    gap: 0.4rem;
  }

  #status-bar-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }

  #status-bar-track {
    width: 100%;
    height: 6px;
    background: #2a2a2a;
    border-radius: 3px;
    overflow: hidden;
  }

  #status-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), #aa5cc3);
    width: 0%;
    transition: width 0.4s ease;
  }

  #status-bar-fill.indeterminate {
    width: 40%;
    animation: slide 1.4s ease-in-out infinite;
  }

  @keyframes slide {
    0%   { margin-left: -40%; }
    100% { margin-left: 100%; }
  }

  /* Timer */
  #timer-wrap {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
  }

  #timer-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #timer {
    font-size: 2.8rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    letter-spacing: 0.04em;
  }

  #timer.done { color: var(--green); }

  /* Spinning cat */
  #spinning-cat {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
  }

  #cat-emoji {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: inline-block;
  }



  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  #status-msg {
    font-size: 0.8rem;
    color: var(--muted);
    min-height: 1.2em;
    text-align: center;
  }
  #status-msg.error { color: var(--red); }

  /* History */
  .history-card {
    padding: 1.75rem 1.75rem 1.25rem;
    align-items: stretch;
    gap: 1rem;
    width: 100%;
    max-width: 640px;
  }

  .history-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }

  .history-head h2 {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #history-count {
    font-size: 0.72rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  #history-list {
    display: flex;
    flex-direction: column;
  }

  .history-row {
    display: grid;
    grid-template-columns: 78px minmax(0, 1fr);
    gap: 0.25rem 0.85rem;
    align-items: start;
    padding: 0.7rem 0;
    border-top: 1px solid var(--border);
  }
  .history-row:first-child { border-top: none; }

  .badge {
    justify-self: start;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 0.22rem 0.5rem;
    border-radius: 999px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .badge.started  { color: var(--green); background: rgba(76, 175, 125, 0.13); border-color: rgba(76, 175, 125, 0.35); }
  .badge.cooldown { color: var(--amber); background: rgba(217, 164, 65, 0.13); border-color: rgba(217, 164, 65, 0.35); }
  .badge.error    { color: var(--red);   background: rgba(224, 82, 96, 0.13);  border-color: rgba(224, 82, 96, 0.35); }
  .badge.unknown  { color: var(--muted); background: rgba(136, 136, 136, 0.13); border-color: var(--border); }

  .history-main { min-width: 0; }

  .history-when {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.5rem;
    font-size: 0.85rem;
  }

  .history-rel {
    font-size: 0.72rem;
    color: var(--muted);
  }

  .history-meta {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    margin-top: 0.2rem;
    font-size: 0.72rem;
    color: var(--muted);
    min-width: 0;
  }

  .history-ip {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--muted);
    white-space: nowrap;
    flex: none;
  }

  .history-sep { color: var(--border); flex: none; }

  .history-ua {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    cursor: help;
  }

  .history-err {
    grid-column: 2;
    margin-top: 0.3rem;
    font-size: 0.72rem;
    color: var(--red);
    overflow-wrap: anywhere;
  }

  #history-empty, #history-error {
    display: none;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
    padding: 0.6rem 0;
  }
  #history-error.show, #history-empty.show { display: block; }
  #history-error { color: var(--red); opacity: 0.8; }
</style>
</head>
<body>

<h1>Jellyfin Scan Media Library</h1>

<div class="card">
  <button id="scan-btn">Scan Media Library</button>

  <div id="status-bar-wrap">
    <div style="display:flex;justify-content:space-between;width:100%;align-items:center;">
      <div id="status-bar-label">Scanning…</div>
      <div id="status-bar-pct" style="font-size:0.78rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;"></div>
    </div>
    <div id="status-bar-track">
      <div id="status-bar-fill"></div>
    </div>
  </div>

  <div id="timer-wrap">
    <div id="timer-label">Next scan available in</div>
    <div id="timer">60:00</div>
  </div>

  <div id="spinning-cat">
    <img id="cat-emoji" src="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/ec666739-122f-41a3-8b0a-c01590f5e9a3/djwlgwe-cb474920-1753-4c4a-a4f4-981a7bcc0eff.png/v1/fill/w_1280,h_1280/oiia_cat_assets_by_awesomeconsoles7_djwlgwe-fullview.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7ImhlaWdodCI6Ijw9MTI4MCIsInBhdGgiOiIvZi9lYzY2NjczOS0xMjJmLTQxYTMtOGIwYS1jMDE1OTBmNWU5YTMvZGp3bGd3ZS1jYjQ3NDkyMC0xNzUzLTRjNGEtYTRmNC05ODFhN2JjYzBlZmYucG5nIiwid2lkdGgiOiI8PTEyODAifV1dLCJhdWQiOlsidXJuOnNlcnZpY2U6aW1hZ2Uub3BlcmF0aW9ucyJdfQ.JmDbU4utg9EFz_jHYqDt9XMPoeJNPT62V3k23yB1eXk" alt="OIIA OIIA" />
  </div>

  <div id="status-msg"></div>
</div>

<div class="card history-card">
  <div class="history-head">
    <h2>Scan History</h2>
    <span id="history-count"></span>
  </div>
  <div id="history-list"></div>
  <div id="history-empty">No scans recorded yet.</div>
  <div id="history-error">Couldn’t load scan history.</div>
</div>

<script>
  const btn             = document.getElementById('scan-btn');
  const timerWrap       = document.getElementById('timer-wrap');
  const timerEl         = document.getElementById('timer');
  const statusBarWrap   = document.getElementById('status-bar-wrap');
  const statusBarFill   = document.getElementById('status-bar-fill');
  const statusBarLabel  = document.getElementById('status-bar-label');
  const statusBarPct    = document.getElementById('status-bar-pct');
  const spinningCat     = document.getElementById('spinning-cat');
  const statusMsg       = document.getElementById('status-msg');

  let tickInterval = null;
  let pollInterval = null;

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatMs(ms) {
    if (ms <= 0) return '00:00';
    const totalSec = Math.ceil(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${pad(m)}:${pad(s)}`;
  }

  function setProgressBar(pct, label) {
    statusBarWrap.style.display = 'flex';
    statusBarFill.classList.remove('indeterminate');
    statusBarFill.style.width = pct + '%';
    statusBarLabel.textContent = label || 'Scanning…';
    statusBarPct.textContent = pct > 0 ? pct.toFixed(1) + '%' : '';
  }

  function startProgressPoll() {
    if (pollInterval) clearInterval(pollInterval);
    statusBarWrap.style.display = 'flex';
    statusBarFill.classList.add('indeterminate');
    statusBarLabel.textContent = 'Scanning…';
    statusBarPct.textContent = '';

    pollInterval = setInterval(async () => {
      try {
        const r = await fetch('/api/scan/progress');
        const d = await r.json();
        if (d.state === 'running') {
          statusBarFill.classList.remove('indeterminate');
          setProgressBar(d.percent, d.name || 'Scanning…');
        } else if (d.state === 'idle') {
          setProgressBar(100, 'Scan complete');
          statusBarPct.textContent = '100%';
          clearInterval(pollInterval);
          setTimeout(() => { statusBarWrap.style.display = 'none'; }, 3000);
        }
      } catch (_) {}
    }, 2000);
  }

  function startCooldown(remainingMs) {
    const until = Date.now() + remainingMs;
    btn.disabled = true;
    timerWrap.style.display = 'flex';
    spinningCat.style.display = 'flex';
    timerEl.classList.remove('done');
    startProgressPoll();

    if (tickInterval) clearInterval(tickInterval);

    tickInterval = setInterval(() => {
      const left = until - Date.now();
      if (left <= 0) {
        clearInterval(tickInterval);
        clearInterval(pollInterval);
        timerEl.classList.add('done');
        timerWrap.style.display = 'none';
        spinningCat.style.display = 'none';
        statusBarWrap.style.display = 'none';
        btn.disabled = false;
        statusMsg.textContent = 'Ready to scan.';
        statusMsg.className = '';
      } else {
        timerEl.textContent = formatMs(left);
      }
    }, 500);
  }

  // Sync state from server on load
  async function syncState() {
    try {
      const r = await fetch('/api/scan/state');
      const d = await r.json();
      if (d.active && d.remaining_ms > 0) {
        timerEl.textContent = formatMs(d.remaining_ms);
        startCooldown(d.remaining_ms);
      }
    } catch (_) {}
  }

  syncState();

  /* ---------------- Scan history ----------------
     SECURITY: every value below (ip, user_agent, error) is client-controlled.
     Rows are built with createElement + textContent ONLY. Never innerHTML. */

  const historyList  = document.getElementById('history-list');
  const historyEmpty = document.getElementById('history-empty');
  const historyError = document.getElementById('history-error');
  const historyCount = document.getElementById('history-count');

  const OUTCOMES = { started: 'started', cooldown: 'cooldown', error: 'error' };

  function formatWhen(ts) {
    const d = new Date(ts * 1000);
    if (isNaN(d.getTime())) return 'Unknown time';
    return d.toLocaleString(undefined, {
      month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit', second: '2-digit'
    });
  }

  function relativeTime(ts) {
    const d = new Date(ts * 1000);
    if (isNaN(d.getTime())) return '';
    const sec = Math.round((Date.now() - d.getTime()) / 1000);
    if (sec < 0)    return 'just now';
    if (sec < 45)   return 'just now';
    const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's') + ' ago';
    const min = Math.round(sec / 60);
    if (min < 60)   return plural(min, 'minute');
    const hrs = Math.round(min / 60);
    if (hrs < 24)   return plural(hrs, 'hour');
    const days = Math.round(hrs / 24);
    if (days < 30)  return plural(days, 'day');
    const months = Math.round(days / 30);
    if (months < 12) return plural(months, 'month');
    return plural(Math.round(months / 12), 'year');
  }

  // Best-effort friendly label. Falls back to the raw UA (CSS-truncated).
  // Return value is ALWAYS inserted with textContent, never as markup.
  function shortUA(ua) {
    if (!ua) return 'unknown browser';
    const browsers = [
      [/Edg(?:e|A|iOS)?\/(\d+)/,  'Edge'],
      [/OPR\/(\d+)/,              'Opera'],
      [/Firefox\/(\d+)/,          'Firefox'],
      [/CriOS\/(\d+)/,            'Chrome'],
      [/Chrome\/(\d+)/,           'Chrome'],
      [/Version\/(\d+).*Safari/,  'Safari'],
      [/curl\/([\d.]+)/,          'curl'],
      [/python-requests\/([\d.]+)/, 'python-requests'],
      [/Wget\/([\d.]+)/,          'Wget'],
    ];
    const platforms = [
      [/Windows NT 10/, 'Windows'],
      [/Windows/,       'Windows'],
      [/iPhone|iPad|iPod/, 'iOS'],
      [/Mac OS X/,      'macOS'],
      [/Android/,       'Android'],
      [/CrOS/,          'ChromeOS'],
      [/Linux/,         'Linux'],
    ];
    let name = '';
    for (const [re, label] of browsers) {
      const m = ua.match(re);
      if (m) { name = label + ' ' + m[1]; break; }
    }
    if (!name) return ua; // unknown agent: show it raw, truncated by CSS
    let os = '';
    for (const [re, label] of platforms) {
      if (re.test(ua)) { os = label; break; }
    }
    return os ? name + ' · ' + os : name;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function buildRow(entry) {
    const outcome = OUTCOMES[entry.outcome] || null;
    const row = el('div', 'history-row');

    const badge = el('span', 'badge ' + (outcome || 'unknown'), outcome || 'unknown');
    row.appendChild(badge);

    const main = el('div', 'history-main');

    const when = el('div', 'history-when');
    const ts = typeof entry.ts === 'number' ? entry.ts : Number(entry.ts);
    when.appendChild(el('span', 'history-time', formatWhen(ts)));
    const rel = relativeTime(ts);
    if (rel) when.appendChild(el('span', 'history-rel', rel));
    main.appendChild(when);

    const meta = el('div', 'history-meta');
    const ip = entry.ip ? String(entry.ip) : 'unknown IP';
    meta.appendChild(el('span', 'history-ip', ip));
    meta.appendChild(el('span', 'history-sep', '•'));

    const ua = entry.user_agent ? String(entry.user_agent) : '';
    const uaEl = el('span', 'history-ua', shortUA(ua));
    uaEl.title = ua || 'No User-Agent sent';   // property assignment, not markup
    meta.appendChild(uaEl);
    main.appendChild(meta);

    row.appendChild(main);

    if (entry.error) {
      row.appendChild(el('div', 'history-err', String(entry.error)));
    }
    return row;
  }

  function renderHistory(entries) {
    clear(historyList);
    historyError.classList.remove('show');

    if (!entries.length) {
      historyEmpty.classList.add('show');
      historyCount.textContent = '';
      return;
    }
    historyEmpty.classList.remove('show');
    historyCount.textContent = entries.length === 1
      ? '1 press'
      : entries.length + ' presses';

    const frag = document.createDocumentFragment();
    for (const entry of entries) {
      if (entry && typeof entry === 'object') frag.appendChild(buildRow(entry));
    }
    historyList.appendChild(frag);
  }

  async function refreshHistory() {
    try {
      const r = await fetch('/api/history?limit=50');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      renderHistory(Array.isArray(d.entries) ? d.entries : []);
    } catch (_) {
      // Quiet failure: leave whatever is already rendered, just flag it.
      historyEmpty.classList.remove('show');
      historyError.classList.add('show');
    }
  }

  refreshHistory();

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    statusMsg.textContent = '';

    try {
      const r = await fetch('/api/scan', { method: 'POST' });
      const d = await r.json();
      if (r.status === 429) {
        startCooldown(d.remaining_ms);
        return;
      }
      if (d.error) throw new Error(d.error);

      statusMsg.textContent = 'Scan started.';
      startCooldown(60 * 60 * 1000);
    } catch (e) {
      statusMsg.textContent = 'Error: ' + e.message;
      statusMsg.className = 'error';
      btn.disabled = false;
    } finally {
      // Every press is recorded server-side: started, cooldown AND error.
      refreshHistory();
    }
  });
</script>
</body>
</html>
