<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#040A12" />
<title>Jellyfin Manager — Library sonar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600..800&family=Instrument+Sans:wght@400..600&family=Spline+Sans+Mono:wght@400..500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --abyss:   #040A12;
    --column:  #08182B;
    --brand:   #00A4DC;
    --medusa:  #A65CC7;
    --lumen:   #4CF2C7;
    --lantern: #FFC069;
    --coral:   #FF6B7A;
    --foam:    #EAF4FF;
    --benthos: #7C93B8;

    --rail:    rgba(140, 180, 235, 0.22);
    --hairline:rgba(140, 180, 235, 0.16);
    --hairline-soft: rgba(140, 180, 235, 0.10);

    --font-display: 'Bricolage Grotesque', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body:    'Instrument Sans', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono:    'Spline Sans Mono', ui-monospace, Menlo, Consolas, monospace;

    /* Opaque enough (WCAG 1.4.3) that a bright bell drifting behind the glass
       can't pull small benthos text below 4.5:1. */
    --glass-bg: rgba(10, 24, 43, 0.85);
  }

  html { overflow-x: hidden; }

  body {
    font-family: var(--font-body);
    font-weight: 400;
    background: linear-gradient(180deg, var(--column) 0%, var(--abyss) 58%) fixed var(--abyss);
    color: var(--foam);
    min-height: 100vh;
    overflow-x: hidden;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- The water ---------- */

  #jellyfield {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    display: block;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(58% 44% at 50% -12%, rgba(150, 205, 240, 0.10), transparent 72%),
      radial-gradient(125% 95% at 50% 42%, transparent 42%, rgba(2, 5, 10, 0.62) 100%);
  }

  /* ---------- Depth rail column ---------- */

  .column {
    position: relative;
    z-index: 2;
    max-width: 600px;
    min-height: 100vh;
    margin-left: clamp(1.5rem, 14vw, 16rem);
    padding: clamp(2rem, 6vh, 3.5rem) 1.5rem 4rem 2.4rem;
    display: flex;
    flex-direction: column;
    gap: 2.4rem;
  }

  .rail {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--rail);
  }
  .rail::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 7px;
    background: repeating-linear-gradient(
      to bottom,
      var(--rail) 0 1px,
      transparent 1px 44px
    );
  }

  .station {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }

  .eyebrow {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--benthos);
  }

  .tick-label {
    position: relative;
    margin-left: -2.4rem;
    padding-left: 1.2rem;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--benthos);
  }
  .tick-label::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    width: 0.75rem;
    height: 1px;
    background: rgba(140, 180, 235, 0.45);
  }

  /* ---------- Brand block (surface) ---------- */

  .brand {
    display: flex;
    align-items: center;
    gap: 0.9rem;
  }

  .brand-glyph {
    flex: none;
    filter: drop-shadow(0 0 10px rgba(166, 92, 199, 0.35));
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .wordmark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.55rem;
    letter-spacing: -0.02em;
    line-height: 1.1;
    background: linear-gradient(92deg, var(--brand) 10%, var(--medusa) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ---------- Glass panels ---------- */

  .panel {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(16px) saturate(1.25);
    backdrop-filter: blur(16px) saturate(1.25);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.06),
      0 22px 55px -18px rgba(2, 8, 18, 0.75),
      0 0 90px -35px rgba(0, 164, 220, 0.14);
    padding: 1.6rem 1.75rem;
    display: flex;
    flex-direction: column;
    gap: 1.4rem;
  }

  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }

  .panel-title {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .panel-title h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: -0.01em;
    color: var(--foam);
  }

  /* ---------- Scan console ---------- */

  #scan-btn {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.02rem;
    letter-spacing: 0.01em;
    color: #03202E;
    background: var(--brand);
    border: 1px solid rgba(160, 225, 255, 0.55);
    border-radius: 12px;
    padding: 0.85rem 2rem;
    width: 100%;
    cursor: pointer;
    box-shadow:
      0 0 22px rgba(0, 164, 220, 0.38),
      0 0 60px -10px rgba(0, 164, 220, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.28);
    transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  #scan-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    filter: brightness(1.12);
    box-shadow:
      0 0 30px rgba(0, 164, 220, 0.55),
      0 0 80px -8px rgba(0, 164, 220, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.32);
  }
  #scan-btn:active:not(:disabled) { transform: translateY(0); filter: brightness(0.98); }
  #scan-btn:disabled {
    opacity: 0.38;
    cursor: not-allowed;
    box-shadow: none;
  }
  #scan-btn:focus-visible {
    outline: 2px solid var(--lumen);
    outline-offset: 3px;
  }

  /* Sonar sweep (progress) */

  #status-bar-wrap {
    width: 100%;
    display: none;           /* JS toggles to flex */
    flex-direction: column;
    gap: 0.55rem;
  }

  .status-bar-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    width: 100%;
  }

  #status-bar-label {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--benthos);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }

  #status-bar-pct {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 0.78rem;
    color: var(--lumen);
    flex: none;
  }

  #status-bar-track {
    width: 100%;
    height: 2px;
    border-radius: 1px;
    background: rgba(140, 180, 235, 0.18);
  }

  #status-bar-fill {
    position: relative;
    height: 100%;
    width: 0%;
    border-radius: 1px;
    background: linear-gradient(90deg, transparent, rgba(76, 242, 199, 0.65) 60%, var(--lumen));
    transition: width 0.4s ease;
  }
  #status-bar-fill::after {
    content: '';
    position: absolute;
    right: -3px;
    top: 50%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    transform: translateY(-50%);
    background: var(--lumen);
    box-shadow: 0 0 10px 2px rgba(76, 242, 199, 0.55);
  }

  #status-bar-fill.indeterminate {
    width: 40%;
    transition: none;
    animation: sonar-sweep 1.8s ease-in-out infinite alternate;
  }

  @keyframes sonar-sweep {
    from { margin-left: 0%; }
    to   { margin-left: 60%; }
  }

  /* Cooldown readout */

  #timer-wrap {
    display: none;           /* JS toggles to flex */
    flex-direction: column;
    align-items: center;
    gap: 0.45rem;
  }

  #timer-label {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--benthos);
  }

  #timer {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 3rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    color: var(--lantern);
    text-shadow: 0 0 18px rgba(255, 192, 105, 0.35);
  }
  #timer.done {
    color: var(--lumen);
    text-shadow: 0 0 18px rgba(76, 242, 199, 0.35);
  }

  /* Porthole (OIIA cat) */

  #spinning-cat {
    display: none;           /* JS toggles to flex */
    flex-direction: column;
    align-items: center;
    padding: 0.9rem 0;
  }

  .porthole {
    position: relative;
    width: 128px;
    height: 128px;
    border-radius: 50%;
    border: 1px solid rgba(255, 192, 105, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 28px -6px rgba(255, 192, 105, 0.30);
  }
  .porthole::before,
  .porthole::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .porthole::before { inset: -8px;  border: 1px solid rgba(255, 192, 105, 0.20); }
  .porthole::after  { inset: -16px; border: 1px solid rgba(255, 192, 105, 0.09); }

  #cat-emoji {
    width: 106px;
    height: 106px;
    object-fit: cover;
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  #status-msg {
    font-size: 0.82rem;
    color: var(--benthos);
    min-height: 1.2em;
    text-align: center;
  }
  #status-msg.error { color: var(--coral); }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- Dive log ---------- */

  #history-count {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--benthos);
    font-variant-numeric: tabular-nums;
    flex: none;
  }

  #history-list {
    display: flex;
    flex-direction: column;
    font-family: var(--font-mono);
  }

  .history-row {
    position: relative;
    display: grid;
    grid-template-columns: auto auto minmax(0, 1fr);
    gap: 0.3rem 0.9rem;
    align-items: baseline;
    padding: 0.7rem 0 0.7rem 1rem;
    border-top: 1px solid var(--hairline-soft);
  }
  .history-row:first-child { border-top: none; }
  .history-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 1.28rem;
    width: 0.55rem;
    height: 1px;
    background: rgba(140, 180, 235, 0.40);
  }

  .history-when { min-width: 0; }

  .history-time {
    display: block;
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 0.8rem;
    color: var(--foam);
    white-space: nowrap;
  }

  .history-rel {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.66rem;
    color: var(--benthos);
    margin-top: 0.15rem;
  }

  .badge {
    justify-self: start;
    font-family: var(--font-body);
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 0.24rem 0.55rem;
    border-radius: 999px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .badge.started  { color: var(--lumen);   background: rgba(76, 242, 199, 0.13);  border-color: rgba(76, 242, 199, 0.35);  text-shadow: 0 0 8px rgba(76, 242, 199, 0.35); }
  .badge.cooldown { color: var(--lantern); background: rgba(255, 192, 105, 0.13); border-color: rgba(255, 192, 105, 0.35); text-shadow: 0 0 8px rgba(255, 192, 105, 0.30); }
  .badge.error    { color: var(--coral);   background: rgba(255, 107, 122, 0.13); border-color: rgba(255, 107, 122, 0.35); text-shadow: 0 0 8px rgba(255, 107, 122, 0.30); }
  .badge.unknown  { color: var(--benthos); background: rgba(124, 147, 184, 0.13); border-color: rgba(124, 147, 184, 0.35); }

  .history-meta {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    font-size: 0.72rem;
    color: var(--benthos);
    min-width: 0;
  }

  .history-user {
    font-family: var(--font-mono);
    color: #A9BEDC;   /* a step brighter than benthos: the human reads first */
    white-space: nowrap;
    /* Usernames are attacker-influenced width (up to 64 chars): shrink and
       ellipsize like .history-ua, capped so ip · browser always keep room. */
    flex: 0 1 auto;
    min-width: 0;
    max-width: 18ch;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: help;
  }

  .history-ip {
    font-family: var(--font-mono);
    color: var(--benthos);
    white-space: nowrap;
    flex: none;
  }

  .history-sep { color: rgba(140, 180, 235, 0.30); flex: none; }

  .history-ua {
    font-family: var(--font-mono);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    cursor: help;
  }

  .history-err {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--coral);
    overflow-wrap: anywhere;
  }

  #history-empty, #history-error {
    display: none;
    font-size: 0.8rem;
    color: var(--benthos);
    text-align: center;
    padding: 0.6rem 0;
  }
  #history-empty.show, #history-error.show { display: block; }
  #history-error { color: var(--coral); opacity: 0.85; }

  /* ---------- Responsive ---------- */

  @media (max-width: 720px) {
    .column {
      margin-left: 0;
      max-width: 100%;
      padding: 1.75rem 1rem 3rem 1rem;
      gap: 1.9rem;
    }
    .rail { display: none; }
    .tick-label { margin-left: 0; padding-left: 0; }
    .tick-label::before { display: none; }
    .panel { border-left: 2px solid var(--rail); }
  }

  @media (max-width: 560px) {
    .history-row { grid-template-columns: minmax(0, 1fr) auto; }
    .history-meta { grid-column: 1 / -1; }
  }

  @media (max-width: 400px) {
    .panel { padding: 1.2rem 1rem; }
    #timer { font-size: 2.4rem; }
    .wordmark { font-size: 1.3rem; }
  }

  /* ---------- Reduced motion: hard floor ---------- */

  @media (prefers-reduced-motion: reduce) {
    #cat-emoji { animation: none; }
    #status-bar-fill.indeterminate { animation: none; margin-left: 30%; }
    #scan-btn { transition: none; }
    #scan-btn:hover:not(:disabled) { transform: none; }
    #status-bar-fill { transition: none; }
  }
</style>
</head>
<body>

<canvas id="jellyfield" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<main class="column">
  <div class="rail" aria-hidden="true"></div>

  <!-- SURFACE -->
  <header class="station">
    <div class="tick-label">Surface</div>
    <div class="brand">
      <svg class="brand-glyph" width="40" height="46" viewBox="0 0 40 46" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="jgrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#A65CC7" />
            <stop offset="1" stop-color="#00A4DC" />
          </linearGradient>
        </defs>
        <path d="M6 20.5C6 11.4 12.3 5 20 5s14 6.4 14 15.5c-4.5 2.7-9.3 4-14 4s-9.5-1.3-14-4z" stroke="url(#jgrad)" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M12 26c-.7 4-2 6.6-1.3 11.5" stroke="url(#jgrad)" stroke-width="1.4" stroke-linecap="round" />
        <path d="M19.6 27c.4 4.6-1.2 8.2.4 13.5" stroke="url(#jgrad)" stroke-width="1.4" stroke-linecap="round" />
        <path d="M27.5 26c.9 3.7 2.2 6.5 1.1 11.5" stroke="url(#jgrad)" stroke-width="1.4" stroke-linecap="round" />
      </svg>
      <div class="brand-text">
        <h1 class="wordmark">Jellyfin Manager</h1>
        <div class="eyebrow">Library sonar</div>
      </div>
    </div>
  </header>

  <!-- CONSOLE -->
  <section class="station">
    <div class="tick-label">Console</div>
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <div class="eyebrow">Instrument</div>
          <h2>Scan console</h2>
        </div>
      </div>

      <button id="scan-btn">Scan media library</button>

      <div id="status-bar-wrap">
        <div class="status-bar-head">
          <div id="status-bar-label">Scanning…</div>
          <div id="status-bar-pct"></div>
        </div>
        <div id="status-bar-track" role="progressbar" aria-labelledby="status-bar-label"
             aria-valuemin="0" aria-valuemax="100">
          <div id="status-bar-fill"></div>
        </div>
      </div>

      <!-- Repaints every 500ms — hidden from screen readers; cooldown state is
           announced once via #sr-announce instead. -->
      <div id="timer-wrap" aria-hidden="true">
        <div id="timer-label">Next scan available in</div>
        <div id="timer">60:00</div>
      </div>

      <div id="spinning-cat" aria-hidden="true">
        <div class="porthole">
          <!-- Decorative, self-hosted (no external CDN / expiring token). If it
               somehow fails to load, hide the porthole so the rings never frame
               a broken-image glyph. -->
          <img id="cat-emoji" src="{{ url_for('static', filename='oiia.png') }}" alt=""
               onerror="this.closest('#spinning-cat').style.visibility='hidden'" />
        </div>
      </div>

      <div id="status-msg" role="status" aria-live="polite"></div>
      <div id="sr-announce" class="sr-only" role="status" aria-live="polite"></div>
    </div>
  </section>

  <!-- DIVE LOG -->
  <section class="station">
    <div class="tick-label">Dive log</div>
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <div class="eyebrow">History</div>
          <h2>Dive log</h2>
        </div>
        <span id="history-count"></span>
      </div>
      <div>
        <div id="history-list"></div>
        <div id="history-empty">No scans recorded yet.</div>
        <div id="history-error">Couldn’t load scan history.</div>
      </div>
    </div>
  </section>
</main>

<script>
/* Jellyfield — abyssal water-column canvas engine for "THE DEEP".
 * Standalone IIFE. Exposes exactly window.Jellyfield = { mount, pulse, setActivity }.
 * Canvas 2D, no libraries, DPR-aware, reduced-motion aware, zero per-frame allocation
 * in the hot loop (sprites/gradients/objects preallocated; slots reused).
 */
(function () {
  'use strict';

  if (window.Jellyfield) { return; }

  /* ---------------------------------------------------------------- palette */
  var MEDUSA = { r: 166, g: 92,  b: 199 }; /* #A65CC7 — creatures */
  var BRAND  = { r: 0,   g: 164, b: 220 }; /* #00A4DC — sonar     */
  var LUMEN  = { r: 76,  g: 242, b: 199 }; /* #4CF2C7             */
  var FOAM   = { r: 234, g: 244, b: 255 }; /* #EAF4FF             */

  function mix(a, b, t) {
    return {
      r: Math.round(a.r + (b.r - a.r) * t),
      g: Math.round(a.g + (b.g - a.g) * t),
      b: Math.round(a.b + (b.b - a.b) * t)
    };
  }
  function rgba(c, a) { return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')'; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smoothstep(t) { return t * t * (3 - 2 * t); }

  /* ------------------------------------------------------------------ state */
  var canvas = null, ctx = null;
  var W = 0, H = 0, DPR = 1;
  var running = false, rafId = 0, lastT = 0, mounted = false;

  var reduced = false, mql = null, mqlBound = false;

  var activity = 0, activityTarget = 0;

  var mouseX = -1e5, mouseY = -1e5, mouseIn = false, lastMouseT = -1e9, cursorA = 0;

  /* --- jellyfish pool (preallocated, reused) --- */
  var MAX_JELLY = 60;
  var jellies = new Array(MAX_JELLY);
  var jellyCount = 0;

  /* --- ripple slots (max 6 concurrent, reused) --- */
  var MAX_RIPPLE = 6;
  var ripples = new Array(MAX_RIPPLE);
  var i0;
  for (i0 = 0; i0 < MAX_RIPPLE; i0++) {
    ripples[i0] = { active: false, x: 0, y: 0, r: 0, maxR: 0, speed: 0, delay: 0, strength: 0, alpha: 0 };
  }

  /* --- sonar flash --- */
  var flash = { active: false, x: 0, y: 0, t: 0, dur: 0.5 };

  /* --- prerendered sprites (built once; backdrops rebuilt on resize) --- */
  var bellSprites = [];       /* 3 color variants */
  var giantSprite = null;
  var lightSprite = null;     /* cursor light */
  var ringSprite = null;      /* ripple ring, peak at RING_PEAK of half-size */
  var flashSprite = null;
  var RING_PEAK = 0.82;
  var SPR_W = 200, SPR_H = 250, SPR_CX = 100, SPR_CY = 92; /* bell center in sprite */
  var bgCanvas = null, vigCanvas = null;

  /* ------------------------------------------------------------ bell sprite */
  function makeBellSprite(m, soft) {
    /* m: 0..1 medusa->brand mix bias; soft: near-giant variant */
    var c = document.createElement('canvas');
    c.width = SPR_W; c.height = SPR_H;
    var g = c.getContext('2d');
    var core = mix(MEDUSA, BRAND, m * 0.35);
    var rim  = mix(BRAND, MEDUSA, 0.15 + m * 0.2);
    var aMul = soft ? 0.4 : 1;
    var R = 62;

    /* outer aura */
    var aura = g.createRadialGradient(SPR_CX, SPR_CY, 6, SPR_CX, SPR_CY, soft ? 118 : 98);
    aura.addColorStop(0, rgba(core, 0.30 * aMul));
    aura.addColorStop(0.55, rgba(rim, 0.11 * aMul));
    aura.addColorStop(1, rgba(rim, 0));
    g.fillStyle = aura;
    g.fillRect(0, 0, SPR_W, SPR_H);

    /* dome path with scalloped margin (4 lobes) */
    function domePath() {
      g.beginPath();
      g.moveTo(SPR_CX - R, 108);
      g.bezierCurveTo(SPR_CX - R, 34, SPR_CX + R, 34, SPR_CX + R, 108);
      var lobes = 4, x0 = SPR_CX + R, span = 2 * R, k;
      for (k = 1; k <= lobes; k++) {
        var ex = x0 - (span * k) / lobes;
        var cxm = x0 - (span * (k - 0.5)) / lobes;
        g.quadraticCurveTo(cxm, 124, ex, 105);
      }
      g.closePath();
    }

    domePath();
    g.save();
    g.clip();
    /* bell body fill: medusa core -> brand rim */
    var body = g.createRadialGradient(SPR_CX, 80, 4, SPR_CX, 86, R * 1.18);
    body.addColorStop(0, rgba(core, 0.88 * aMul));
    body.addColorStop(0.45, rgba(mix(core, rim, 0.5), 0.5 * aMul));
    body.addColorStop(0.8, rgba(rim, 0.4 * aMul));
    body.addColorStop(1, rgba(rim, 0.06 * aMul));
    g.fillStyle = body;
    g.fillRect(0, 0, SPR_W, SPR_H);
    /* radial canals */
    g.strokeStyle = rgba(FOAM, 0.15 * aMul);
    g.lineWidth = 1.4;
    var canals = 5, ci;
    for (ci = 0; ci < canals; ci++) {
      var fx = ci / (canals - 1) - 0.5;
      g.beginPath();
      g.moveTo(SPR_CX, 56);
      g.quadraticCurveTo(SPR_CX + fx * R * 0.7, 84, SPR_CX + fx * R * 1.55, 106);
      g.stroke();
    }
    /* bright nucleus */
    var nuc = g.createRadialGradient(SPR_CX, 80, 0, SPR_CX, 82, 27);
    nuc.addColorStop(0, rgba(FOAM, 0.85 * aMul));
    nuc.addColorStop(0.4, rgba(mix(core, FOAM, 0.4), 0.4 * aMul));
    nuc.addColorStop(1, rgba(core, 0));
    g.fillStyle = nuc;
    g.fillRect(0, 0, SPR_W, SPR_H);
    /* faint bioluminescent underside at the margin */
    var und = g.createRadialGradient(SPR_CX, 108, 2, SPR_CX, 108, R * 0.9);
    und.addColorStop(0, rgba(LUMEN, 0.14 * aMul));
    und.addColorStop(1, rgba(LUMEN, 0));
    g.fillStyle = und;
    g.fillRect(0, 0, SPR_W, SPR_H);
    g.restore();

    /* rim stroke */
    domePath();
    g.strokeStyle = rgba(mix(rim, FOAM, 0.35), 0.5 * aMul);
    g.lineWidth = 2.2;
    g.stroke();
    /* crisper top-dome highlight */
    g.beginPath();
    g.moveTo(SPR_CX - R * 0.78, 78);
    g.bezierCurveTo(SPR_CX - R * 0.6, 46, SPR_CX + R * 0.6, 46, SPR_CX + R * 0.78, 78);
    g.strokeStyle = rgba(FOAM, 0.28 * aMul);
    g.lineWidth = 1.6;
    g.stroke();
    return c;
  }

  function makeRadialSprite(size, stops) {
    var c = document.createElement('canvas');
    c.width = size; c.height = size;
    var g = c.getContext('2d');
    var grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    var i;
    for (i = 0; i < stops.length; i++) { grad.addColorStop(stops[i][0], stops[i][1]); }
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    return c;
  }

  function buildSprites() {
    bellSprites[0] = makeBellSprite(0.0, false);
    bellSprites[1] = makeBellSprite(0.5, false);
    bellSprites[2] = makeBellSprite(1.0, false);
    giantSprite = makeBellSprite(0.3, true);
    lightSprite = makeRadialSprite(256, [
      [0, rgba(mix(BRAND, FOAM, 0.55), 0.22)],
      [0.45, rgba(mix(BRAND, FOAM, 0.2), 0.09)],
      [1, rgba(BRAND, 0)]
    ]);
    flashSprite = makeRadialSprite(256, [
      [0, rgba(mix(BRAND, FOAM, 0.7), 0.9)],
      [0.35, rgba(BRAND, 0.35)],
      [1, rgba(BRAND, 0)]
    ]);
    /* sonar ring: soft-edged annulus with its peak at RING_PEAK */
    var c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    var g = c.getContext('2d');
    var grad = g.createRadialGradient(256, 256, 0, 256, 256, 256);
    grad.addColorStop(0, rgba(BRAND, 0));
    grad.addColorStop(RING_PEAK - 0.16, rgba(BRAND, 0));
    grad.addColorStop(RING_PEAK - 0.05, rgba(BRAND, 0.28));
    grad.addColorStop(RING_PEAK, rgba(mix(BRAND, FOAM, 0.65), 0.85));
    grad.addColorStop(RING_PEAK + 0.05, rgba(BRAND, 0.25));
    grad.addColorStop(clamp(RING_PEAK + 0.14, 0, 1), rgba(BRAND, 0));
    grad.addColorStop(1, rgba(BRAND, 0));
    g.fillStyle = grad;
    g.fillRect(0, 0, 512, 512);
    ringSprite = c;
  }

  /* -------------------------------------------------- background / vignette */
  function buildBackdrops() {
    /* water column gradient + light shaft (under everything) */
    bgCanvas = document.createElement('canvas');
    bgCanvas.width = Math.max(1, Math.round(W * DPR));
    bgCanvas.height = Math.max(1, Math.round(H * DPR));
    var g = bgCanvas.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    var grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0B2036');
    grad.addColorStop(0.34, '#08182B');
    grad.addColorStop(1, '#040A12');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
    /* faint light shaft falling from the surface */
    var sx = W * 0.6, i;
    for (i = 0; i < 5; i++) {
      var half = W * (0.045 + i * 0.05);
      var sg = g.createLinearGradient(0, 0, 0, H * 0.74);
      sg.addColorStop(0, 'rgba(130,185,235,' + (0.05 - i * 0.009).toFixed(3) + ')');
      sg.addColorStop(1, 'rgba(130,185,235,0)');
      g.fillStyle = sg;
      g.beginPath();
      g.moveTo(sx - half * 0.45, -4);
      g.lineTo(sx + half * 0.45, -4);
      g.lineTo(sx + half * 1.7, H * 0.74);
      g.lineTo(sx - half * 1.7, H * 0.74);
      g.closePath();
      g.fill();
    }

    /* vignette (over everything): darker at edges */
    vigCanvas = document.createElement('canvas');
    vigCanvas.width = bgCanvas.width;
    vigCanvas.height = bgCanvas.height;
    var v = vigCanvas.getContext('2d');
    v.setTransform(DPR, 0, 0, DPR, 0, 0);
    var m = Math.max(W, H);
    var vg = v.createRadialGradient(W * 0.5, H * 0.42, Math.min(W, H) * 0.3, W * 0.5, H * 0.5, m * 0.78);
    vg.addColorStop(0, 'rgba(2,5,10,0)');
    vg.addColorStop(0.7, 'rgba(2,5,10,0.22)');
    vg.addColorStop(1, 'rgba(2,5,10,0.6)');
    v.fillStyle = vg;
    v.fillRect(0, 0, W, H);
  }

  /* -------------------------------------------------------------- jellyfish */
  function makeJelly() {
    return {
      x: 0, y: 0, depth: 0, scale: 1, baseAlpha: 0.6,
      speed: 0, kick: 0,
      phase: 0, phaseRate: 1,
      wobPhase: 0, wobRate: 1, wobAmp: 8,
      vx: 0, vy: 0,               /* transient impulses (ripples) */
      ox: 0, oy: 0,               /* eased flow-field offset */
      tox: 0, toy: 0,             /* flow-field target (scratch) */
      bright: 1, brightT: 1,
      seed: 0, sprite: 0, giant: false,
      tentN: 5, tentLen: 60,
      tentColor: '', armColor: ''
    };
  }
  for (i0 = 0; i0 < MAX_JELLY; i0++) { jellies[i0] = makeJelly(); }

  function initJelly(j, giant) {
    var d = giant ? (0.96 + Math.random() * 0.04) : Math.random();
    j.depth = d;
    j.giant = giant;
    j.scale = giant ? (1.6 + Math.random() * 0.5) : (0.35 + d * 0.75); /* 0.35..1.1 */
    j.baseAlpha = giant ? 0.16 : (0.34 + d * 0.56);
    j.x = Math.random() * W;
    j.y = Math.random() * H;
    j.speed = (7 + Math.random() * 9) * (0.45 + d * 0.75) * (giant ? 0.5 : 1);
    j.kick = (16 + Math.random() * 14) * (0.5 + d * 0.6);
    j.phase = Math.random() * Math.PI * 2;
    j.phaseRate = (0.9 + Math.random() * 0.7) * (giant ? 0.5 : 1);
    j.wobPhase = Math.random() * Math.PI * 2;
    j.wobRate = 0.25 + Math.random() * 0.35;
    j.wobAmp = (5 + Math.random() * 9) * (0.5 + d);
    j.vx = 0; j.vy = 0; j.ox = 0; j.oy = 0; j.bright = 1; j.brightT = 1;
    j.seed = Math.random() * Math.PI * 2;
    j.sprite = (Math.random() * 3) | 0;
    j.tentN = 4 + ((Math.random() * 3) | 0);      /* 4..6 */
    j.tentLen = 68 + Math.random() * 52;
    var tm = Math.random();
    j.tentColor = rgba(mix(MEDUSA, BRAND, tm * 0.5), 0.62);
    j.armColor = rgba(mix(MEDUSA, FOAM, 0.25), 0.42);
  }

  function populate() {
    var mobile = W <= 720;
    var n = mobile ? 25 : 48;
    var giants = mobile ? 1 : 2;
    jellyCount = Math.min(MAX_JELLY, n + giants);
    var i;
    for (i = 0; i < jellyCount; i++) {
      initJelly(jellies[i], i >= jellyCount - giants);
    }
    /* depth sort once: far first, giants (nearest) last; depth never changes */
    jellies.sort(function (a, b) { return a.depth - b.depth; });
  }

  /* ----------------------------------------------------------------- update */
  function update(dt, now) {
    activity += (activityTarget - activity) * Math.min(1, dt * 1.6);
    if (Math.abs(activityTarget - activity) < 0.002) { activity = activityTarget; }

    /* cursor light presence (fade after 2s idle or pointer gone) */
    var wantCursor = mouseIn && (now - lastMouseT < 2000);
    cursorA += ((wantCursor ? 1 : 0) - cursorA) * Math.min(1, dt * 4);

    /* ripples */
    var ri;
    for (ri = 0; ri < MAX_RIPPLE; ri++) {
      var rp = ripples[ri];
      if (!rp.active) { continue; }
      if (rp.delay > 0) { rp.delay -= dt; continue; }
      rp.r += rp.speed * dt;
      var f = 1 - rp.r / rp.maxR;
      if (f <= 0) { rp.active = false; continue; }
      rp.alpha = f * f * Math.min(1, rp.strength);
    }
    if (flash.active) {
      flash.t += dt;
      if (flash.t >= flash.dur) { flash.active = false; }
    }

    var speedMul = 0.55 + activity * 1.5;
    var i;
    for (i = 0; i < jellyCount; i++) {
      var j = jellies[i];
      j.phase += j.phaseRate * (0.65 + activity * 0.9) * dt;
      j.wobPhase += j.wobRate * dt;

      /* bell contraction: sharp on the positive half -> propulsion kick */
      var s = Math.sin(j.phase);
      var c = s > 0 ? s * s : 0;

      /* transient impulses decay */
      var decay = Math.max(0, 1 - dt * 2.4);
      j.vx *= decay; j.vy *= decay;

      j.x += (Math.sin(j.wobPhase) * j.wobAmp * 0.55 + j.vx) * dt;
      j.y += (-(j.speed + j.kick * c) * speedMul + j.vy) * dt;

      /* wrap: rises past the surface -> respawn below */
      var mrg = 170 * j.scale;
      if (j.y < -mrg) { j.y = H + mrg * 0.8; j.x = Math.random() * W; }
      else if (j.y > H + mrg * 1.5) { j.y = -mrg * 0.5; }
      if (j.x < -mrg) { j.x = W + mrg; } else if (j.x > W + mrg) { j.x = -mrg; }

      /* flow field: part around cursor, smoothstep falloff, depth-scaled */
      j.tox = 0; j.toy = 0;
      var bT = 1;
      if (mouseIn) {
        var dx = j.x - mouseX, dy = j.y - mouseY;
        var R = 180 * (0.45 + j.depth * 0.75);
        var d2 = dx * dx + dy * dy;
        if (d2 < R * R && d2 > 0.01) {           /* early-out for far jellies */
          var d = Math.sqrt(d2);
          var t = smoothstep(1 - d / R);
          var push = (62 * (0.4 + j.depth)) * t;
          j.tox = (dx / d) * push;
          j.toy = (dy / d) * push;
          bT = 1 + 0.5 * t;                       /* brighten up to 1.5x */
        }
      }
      j.ox += (j.tox - j.ox) * Math.min(1, dt * 4.2);
      j.oy += (j.toy - j.oy) * Math.min(1, dt * 4.2);

      /* ripple wavefronts push + flash as they pass */
      for (ri = 0; ri < MAX_RIPPLE; ri++) {
        var rp2 = ripples[ri];
        if (!rp2.active || rp2.delay > 0) { continue; }
        var rdx = j.x - rp2.x, rdy = j.y - rp2.y;
        var band = 70;
        var lo = rp2.r - band, hi = rp2.r + band;
        var rd2 = rdx * rdx + rdy * rdy;
        if (rd2 > hi * hi || (lo > 0 && rd2 < lo * lo)) { continue; }
        var rd = Math.sqrt(rd2);
        if (rd < 0.5) { continue; }
        var w = 1 - Math.abs(rd - rp2.r) / band;
        w = w * w * rp2.alpha;
        j.vx += (rdx / rd) * w * 340 * dt * (0.4 + j.depth);
        j.vy += (rdy / rd) * w * 340 * dt * (0.4 + j.depth);
        var rb = 1 + w * 1.1;
        if (rb > bT) { bT = rb; }
      }

      j.brightT = bT;
      j.bright += (j.brightT - j.bright) * Math.min(1, dt * 3);
    }
  }

  /* ------------------------------------------------------------------- draw */
  function drawJelly(j, dim) {
    var s = Math.sin(j.phase);
    var c = s > 0 ? s * s : 0;
    var sqX = 1 - 0.26 * c;   /* bell narrows at contraction */
    var sqY = 1 + 0.17 * c;   /* ...and elongates */
    var sc = j.scale * 0.55;  /* sprite unit -> css px */
    var alpha = j.baseAlpha * (0.8 + 0.3 * activity) * Math.min(1.35, j.bright) * dim;
    if (alpha <= 0.01) { return; }

    ctx.save();
    ctx.translate(j.x + j.ox, j.y + j.oy);

    /* tentacles behind the bell */
    var n = j.tentN, i;
    ctx.lineCap = 'round';
    ctx.strokeStyle = j.tentColor;
    ctx.lineWidth = Math.max(0.6, 1.7 * sc);
    ctx.globalAlpha = alpha * 0.8;
    var lean = -Math.sin(j.wobPhase) * 9 * sc;
    for (i = 0; i < n; i++) {
      var fx = n > 1 ? (i / (n - 1) - 0.5) : 0;
      var ax = fx * 96 * sc * sqX;
      var ay = 15 * sc * sqY;
      var len = j.tentLen * sc * (1 - 0.16 * c) * (1 - Math.abs(fx) * 0.5);
      var sw1 = Math.sin(j.phase * 0.85 + j.seed + i * 1.9) * 15 * sc;
      var sw2 = Math.sin(j.phase * 0.85 + j.seed + i * 1.9 + 1.45) * 24 * sc;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.quadraticCurveTo(ax + sw1 * 0.55 + lean * 0.3, ay + len * 0.5, ax + sw1 + lean * 0.6, ay + len * 0.82);
      ctx.quadraticCurveTo(ax + sw1 + (sw2 - sw1) * 0.7 + lean * 0.8, ay + len * 0.95, ax + sw2 + lean, ay + len);
      ctx.stroke();
    }
    /* two thicker oral arms */
    ctx.strokeStyle = j.armColor;
    ctx.lineWidth = Math.max(1, 3.1 * sc);
    ctx.globalAlpha = alpha * 0.6;
    for (i = 0; i < 2; i++) {
      var side = i === 0 ? -1 : 1;
      var ax2 = side * 14 * sc * sqX;
      var len2 = j.tentLen * sc * 0.62 * (1 - 0.16 * c);
      var sw = Math.sin(j.phase * 0.85 + j.seed + 3 + i * 2.4) * 12 * sc;
      ctx.beginPath();
      ctx.moveTo(ax2, 12 * sc * sqY);
      ctx.quadraticCurveTo(ax2 + sw * 0.6 + lean * 0.4, len2 * 0.55, ax2 + sw + lean * 0.8, len2);
      ctx.stroke();
    }

    /* bell */
    var spr = j.giant ? giantSprite : bellSprites[j.sprite];
    var bw = SPR_W * sc * sqX;
    var bh = SPR_H * sc * sqY;
    ctx.globalAlpha = alpha;
    ctx.drawImage(spr, -SPR_CX * sc * sqX, -SPR_CY * sc * sqY, bw, bh);
    /* excitement glow pass */
    if (j.bright > 1.06) {
      ctx.globalAlpha = Math.min(0.7, (j.bright - 1) * 0.75) * dim;
      ctx.drawImage(spr, -SPR_CX * sc * sqX * 1.06, -SPR_CY * sc * sqY * 1.06, bw * 1.06, bh * 1.06);
    }
    ctx.restore();
  }

  function draw() {
    /* water */
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(bgCanvas, 0, 0, W, H);

    /* luminous passes */
    ctx.globalCompositeOperation = 'lighter';

    /* cursor light illuminates the water locally */
    if (cursorA > 0.01) {
      var lr = 300 + activity * 90;
      ctx.globalAlpha = cursorA * 0.9;
      ctx.drawImage(lightSprite, mouseX - lr, mouseY - lr, lr * 2, lr * 2);
    }

    /* jellyfish, far -> near (pre-sorted by depth); dimmed under the text column */
    var i;
    for (i = 0; i < jellyCount; i++) {
      var jd = jellies[i];
      drawJelly(jd, columnDim(jd.x + jd.ox));
    }

    /* ripples */
    for (i = 0; i < MAX_RIPPLE; i++) {
      var rp = ripples[i];
      if (!rp.active || rp.delay > 0 || rp.r <= 1) { continue; }
      var dsz = (rp.r / RING_PEAK) * 2;
      ctx.globalAlpha = rp.alpha * 0.9;
      ctx.drawImage(ringSprite, rp.x - dsz / 2, rp.y - dsz / 2, dsz, dsz);
    }

    /* sonar flash at the pulse origin */
    if (flash.active) {
      var ft = 1 - flash.t / flash.dur;
      var fr = 120 + (1 - ft) * 160;
      ctx.globalAlpha = ft * ft * 0.85;
      ctx.drawImage(flashSprite, flash.x - fr, flash.y - fr, fr * 2, fr * 2);
    }

    /* field-energy shimmer: whole water brightens with activity */
    if (activity > 0.02) {
      ctx.globalAlpha = activity * 0.06;
      ctx.fillStyle = '#7FD8FF';
      ctx.fillRect(0, 0, W, H);
    }

    /* reset compositing, then vignette on top */
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(vigCanvas, 0, 0, W, H);
  }

  /* --------------------------------------------------------- reduced motion */
  function renderStatic() {
    if (!ctx) { return; }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(bgCanvas, 0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    var n = Math.min(8, jellyCount), i;
    for (i = 0; i < n; i++) {
      var j = jellies[Math.min(jellyCount - 1, Math.floor((i + 0.5) * jellyCount / n))];
      /* deterministic calm placement, dim, near-still */
      j.x = W * (0.1 + 0.8 * ((i * 0.618034 + 0.07) % 1));
      j.y = H * (0.12 + 0.74 * ((i * 0.381966 + 0.23) % 1));
      j.ox = 0; j.oy = 0; j.bright = 1; j.phase = 2.2 + i * 0.9;
      drawJelly(j, 0.55 * columnDim(j.x));
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(vigCanvas, 0, 0, W, H);
  }

  /* ------------------------------------------------------------------- loop */
  function frame(t) {
    rafId = 0;
    if (!running) { return; }
    var dt = (t - lastT) / 1000;
    lastT = t;
    if (dt > 0.05) { dt = 0.05; }
    if (dt > 0) { update(dt, t); }
    draw();
    rafId = requestAnimationFrame(frame);
  }

  function start() {
    if (running || reduced || !mounted) { return; }
    running = true;
    lastT = performance.now();
    if (!rafId) { rafId = requestAnimationFrame(frame); }
  }

  function stop() {
    running = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  }

  /* ----------------------------------------------------------- mgmt/events */

  /* Text-column dim band (a11y): the page's overlay text (tick labels,
     eyebrows) sits directly on the water. Jellies passing under it are dimmed
     toward DIM_FLOOR so small benthos text keeps a dark backdrop. */
  var dimL = 0, dimR = -1, DIM_FEATHER = 120, DIM_FLOOR = 0.35;
  function measureColumn() {
    var col = document.querySelector('.column');
    if (col) {
      var r = col.getBoundingClientRect();
      dimL = r.left - 60;   /* also cover rail marks hanging left of the column */
      dimR = r.right;
    } else {
      dimL = 0; dimR = -1;  /* disabled */
    }
  }
  function columnDim(x) {
    if (dimR < dimL) { return 1; }
    var t;
    if (x >= dimL && x <= dimR) { t = 0; }
    else if (x < dimL) { t = (dimL - x) / DIM_FEATHER; }
    else { t = (x - dimR) / DIM_FEATHER; }
    if (t >= 1) { return 1; }
    return DIM_FLOOR + (1 - DIM_FLOOR) * smoothstep(t);
  }

  function applyResize() {
    if (!canvas) { return; }
    var rect = canvas.getBoundingClientRect();
    var newW = rect.width || window.innerWidth;
    var newH = rect.height || window.innerHeight;
    var newDPR = Math.min(2, window.devicePixelRatio || 1);
    measureColumn();
    if (newW === W && newH === H && newDPR === DPR && bgCanvas) { return; }
    var oldW = W, oldH = H;
    W = newW; H = newH; DPR = newDPR;
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildBackdrops();
    var wasMobile = oldW > 0 && oldW <= 720;
    var isMobile = W <= 720;
    if (jellyCount === 0 || oldW <= 0 || oldH <= 0 || wasMobile !== isMobile) {
      populate();               /* first mount, or the density breakpoint flipped */
    } else {
      /* rescale existing positions so the field survives the resize
         instead of teleporting to fresh random spots mid-gesture */
      var sx = W / oldW, sy = H / oldH, i;
      for (i = 0; i < jellyCount; i++) { jellies[i].x *= sx; jellies[i].y *= sy; }
    }
    if (reduced) { renderStatic(); }
  }

  /* Debounced 150ms trailing: drag-resize and mobile URL-bar/soft-keyboard
     viewport changes fire resize per frame, and each applyResize reallocates
     two full-screen DPR-scaled canvases — run it once per settled size. */
  var resizeTimer = 0;
  function resize() {
    if (resizeTimer) { clearTimeout(resizeTimer); }
    resizeTimer = setTimeout(function () { resizeTimer = 0; applyResize(); }, 150);
  }

  function onMouseMove(e) {
    if (reduced) { return; }
    mouseX = e.clientX;
    mouseY = e.clientY;
    mouseIn = true;
    lastMouseT = performance.now();
  }

  function onMouseOut(e) {
    if (!e.relatedTarget) { mouseIn = false; }
  }

  function onVisibility() {
    if (document.hidden) { stop(); }
    else if (!reduced) { start(); }
  }

  function onMotionChange() {
    reduced = !!(mql && mql.matches);
    if (reduced) {
      stop();
      activity = 0; activityTarget = 0; cursorA = 0; mouseIn = false;
      var i;
      for (i = 0; i < MAX_RIPPLE; i++) { ripples[i].active = false; }
      flash.active = false;
      renderStatic();
    } else {
      populate();
      start();
    }
  }

  /* --------------------------------------------------------------- API ---- */
  function mount(canvasEl) {
    if (!canvasEl || typeof canvasEl.getContext !== 'function') { return; }
    if (mounted && canvasEl === canvas) { return; }
    if (mounted) { stop(); }
    canvas = canvasEl;
    ctx = canvas.getContext('2d');
    if (!ctx) { return; }
    if (!bellSprites[0]) { buildSprites(); }

    mql = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    reduced = !!(mql && mql.matches);
    if (mql && !mqlBound) {
      mqlBound = true;
      if (typeof mql.addEventListener === 'function') { mql.addEventListener('change', onMotionChange); }
      else if (typeof mql.addListener === 'function') { mql.addListener(onMotionChange); }
    }

    if (!mounted) {
      window.addEventListener('mousemove', onMouseMove, { passive: true });
      window.addEventListener('mouseout', onMouseOut, { passive: true });
      /* NOTE: no engine-internal click listener — the page owns click->pulse
         wiring (it excludes controls that fire their own bloom), so each click
         spawns exactly one ripple. */
      window.addEventListener('resize', resize);
      document.addEventListener('visibilitychange', onVisibility);
    }
    mounted = true;

    applyResize();
    if (reduced) { renderStatic(); }
    else { start(); }
  }

  function pulse(clientX, clientY, strength) {
    if (!mounted || reduced) { return; }
    var s = (typeof strength === 'number' && isFinite(strength)) ? strength : 1;
    var x = typeof clientX === 'number' ? clientX : W * 0.5;
    var y = typeof clientY === 'number' ? clientY : H * 0.5;
    var rings = s >= 2 ? 3 : 1;
    var k;
    for (k = 0; k < rings; k++) {
      /* claim a free slot, else recycle the most-expired ripple (cap 6) */
      var slot = null, oldest = null, oldestF = -1, ri;
      for (ri = 0; ri < MAX_RIPPLE; ri++) {
        var rp = ripples[ri];
        if (!rp.active) { slot = rp; break; }
        var fexp = rp.maxR > 0 ? rp.r / rp.maxR : 1;
        if (fexp > oldestF) { oldestF = fexp; oldest = rp; }
      }
      if (!slot) { slot = oldest; }
      slot.active = true;
      slot.x = x;
      slot.y = y;
      slot.r = 0;
      slot.maxR = (rings > 1 ? Math.max(W, H) * 0.85 : 430) * (0.75 + Math.min(s, 3) * 0.18);
      slot.speed = (rings > 1 ? 560 : 430) * (0.8 + Math.min(s, 3) * 0.12);
      slot.delay = k * 0.18;                       /* staggered ~180ms */
      slot.strength = Math.min(s, 3) * (1 - k * 0.22);
      slot.alpha = 0;
    }
    if (s >= 2) {
      flash.active = true;
      flash.x = x;
      flash.y = y;
      flash.t = 0;
    }
  }

  function setActivity(level) {
    var v = (typeof level === 'number' && isFinite(level)) ? level : 0;
    activityTarget = clamp(v, 0, 1);
  }

  window.Jellyfield = { mount: mount, pulse: pulse, setActivity: setActivity };
})();
</script>
<script>
  const btn             = document.getElementById('scan-btn');
  const timerWrap       = document.getElementById('timer-wrap');
  const timerEl         = document.getElementById('timer');
  const statusBarWrap   = document.getElementById('status-bar-wrap');
  const statusBarTrack  = document.getElementById('status-bar-track');
  const statusBarFill   = document.getElementById('status-bar-fill');
  const statusBarLabel  = document.getElementById('status-bar-label');
  const statusBarPct    = document.getElementById('status-bar-pct');
  const spinningCat     = document.getElementById('spinning-cat');
  const statusMsg       = document.getElementById('status-msg');
  const srAnnounce      = document.getElementById('sr-announce');

  let tickInterval = null;
  let pollInterval = null;
  let doneHideTimeout = null;
  let cooldownActive = false;

  /* ---------------- Jellyfield hooks ----------------
     The engine is injected separately; every call is optional-chained
     so a missing engine never throws. */

  window.Jellyfield?.mount(document.getElementById('jellyfield'));

  document.addEventListener('click', (e) => {
    if (e.target && e.target.closest && e.target.closest('#scan-btn')) return; // the button fires its own sonar bloom
    window.Jellyfield?.pulse(e.clientX, e.clientY, 1);
  });

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatMs(ms) {
    if (ms <= 0) return '00:00';
    const totalSec = Math.ceil(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${pad(m)}:${pad(s)}`;
  }

  function setProgressBar(pct, label) {
    statusBarWrap.style.display = 'flex';
    statusBarFill.classList.remove('indeterminate');
    statusBarFill.style.width = pct + '%';
    statusBarLabel.textContent = label || 'Scanning…';
    statusBarPct.textContent = pct > 0 ? pct.toFixed(1) + '%' : '';
    statusBarTrack.setAttribute('aria-valuenow', String(Math.round(pct)));
    statusBarTrack.removeAttribute('aria-valuetext');
  }

  function startProgressPoll() {
    if (pollInterval) clearInterval(pollInterval);
    statusBarWrap.style.display = 'flex';
    statusBarFill.classList.add('indeterminate');
    statusBarLabel.textContent = 'Scanning…';
    statusBarPct.textContent = '';
    statusBarTrack.removeAttribute('aria-valuenow');           // indeterminate phase
    statusBarTrack.setAttribute('aria-valuetext', 'Scanning');

    pollInterval = setInterval(async () => {
      try {
        const r = await fetch('/api/scan/progress');
        const d = await r.json();
        if (d.state === 'running') {
          statusBarFill.classList.remove('indeterminate');
          setProgressBar(d.percent, d.name || 'Scanning…');
        } else if (d.state === 'idle') {
          setProgressBar(100, 'Scan complete');
          statusBarPct.textContent = '100%';
          clearInterval(pollInterval);
          setTimeout(() => { statusBarWrap.style.display = 'none'; }, 3000);
        }
      } catch (_) {}
    }, 2000);
  }

  function startCooldown(remainingMs) {
    const until = Date.now() + remainingMs;
    cooldownActive = true;
    btn.disabled = true;
    if (doneHideTimeout) { clearTimeout(doneHideTimeout); doneHideTimeout = null; }
    timerWrap.style.display = 'flex';
    spinningCat.style.display = 'flex';
    timerEl.classList.remove('done');
    // One polite announcement per cooldown; the visual 500ms countdown itself
    // is aria-hidden so it can't spam screen readers.
    srAnnounce.textContent = 'Scan cooldown active. Next scan available in about '
      + Math.max(1, Math.ceil(remainingMs / 60000)) + ' minutes.';
    startProgressPoll();

    if (tickInterval) clearInterval(tickInterval);

    tickInterval = setInterval(() => {
      const left = until - Date.now();
      if (left <= 0) {
        clearInterval(tickInterval);
        clearInterval(pollInterval);
        // Let the lantern countdown turn lumen at 00:00 for a beat before it
        // disappears — hiding it in the same tick meant the .done state never
        // painted a single frame.
        timerEl.textContent = '00:00';
        timerEl.classList.add('done');
        if (doneHideTimeout) clearTimeout(doneHideTimeout);
        doneHideTimeout = setTimeout(() => { timerWrap.style.display = 'none'; }, 1200);
        spinningCat.style.display = 'none';
        statusBarWrap.style.display = 'none';
        btn.disabled = false;
        statusMsg.textContent = 'Ready to scan.';
        statusMsg.className = '';
        cooldownActive = false;
        window.Jellyfield?.setActivity(0);
      } else {
        timerEl.textContent = formatMs(left);
      }
    }, 500);
  }

  // Sync state from server on load
  async function syncState() {
    try {
      const r = await fetch('/api/scan/state');
      const d = await r.json();
      if (d.active && d.remaining_ms > 0) {
        timerEl.textContent = formatMs(d.remaining_ms);
        startCooldown(d.remaining_ms);
        window.Jellyfield?.setActivity(0.25); // resumed cooldown: faint shimmer, no bloom
      }
    } catch (_) {}
  }

  syncState();

  /* ---------------- Dive log ----------------
     SECURITY: every value below (user, ip, user_agent, error) is
     attacker-influenced (user is a Jellyfin account name). Rows are built
     with createElement + textContent ONLY. Never innerHTML. */

  const historyList  = document.getElementById('history-list');
  const historyEmpty = document.getElementById('history-empty');
  const historyError = document.getElementById('history-error');
  const historyCount = document.getElementById('history-count');

  const OUTCOMES = { started: 'started', cooldown: 'cooldown', error: 'error' };

  function formatWhen(ts) {
    const d = new Date(ts * 1000);
    if (isNaN(d.getTime())) return 'Unknown time';
    return d.toLocaleString(undefined, {
      month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit', second: '2-digit'
    });
  }

  function relativeTime(ts) {
    const d = new Date(ts * 1000);
    if (isNaN(d.getTime())) return '';
    const sec = Math.round((Date.now() - d.getTime()) / 1000);
    if (sec < 0)    return 'just now';
    if (sec < 45)   return 'just now';
    const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's') + ' ago';
    const min = Math.round(sec / 60);
    if (min < 60)   return plural(min, 'minute');
    const hrs = Math.round(min / 60);
    if (hrs < 24)   return plural(hrs, 'hour');
    const days = Math.round(hrs / 24);
    if (days < 30)  return plural(days, 'day');
    const months = Math.round(days / 30);
    if (months < 12) return plural(months, 'month');
    return plural(Math.round(months / 12), 'year');
  }

  // Best-effort friendly label. Falls back to the raw UA (CSS-truncated).
  // Return value is ALWAYS inserted with textContent, never as markup.
  function shortUA(ua) {
    if (!ua) return 'unknown browser';
    const browsers = [
      [/Edg(?:e|A|iOS)?\/(\d+)/,  'Edge'],
      [/OPR\/(\d+)/,              'Opera'],
      [/Firefox\/(\d+)/,          'Firefox'],
      [/CriOS\/(\d+)/,            'Chrome'],
      [/Chrome\/(\d+)/,           'Chrome'],
      [/Version\/(\d+).*Safari/,  'Safari'],
      [/curl\/([\d.]+)/,          'curl'],
      [/python-requests\/([\d.]+)/, 'python-requests'],
      [/Wget\/([\d.]+)/,          'Wget'],
    ];
    const platforms = [
      [/Windows NT 10/, 'Windows'],
      [/Windows/,       'Windows'],
      [/iPhone|iPad|iPod/, 'iOS'],
      [/Mac OS X/,      'macOS'],
      [/Android/,       'Android'],
      [/CrOS/,          'ChromeOS'],
      [/Linux/,         'Linux'],
    ];
    let name = '';
    for (const [re, label] of browsers) {
      const m = ua.match(re);
      if (m) { name = label + ' ' + m[1]; break; }
    }
    if (!name) return ua; // unknown agent: show it raw, truncated by CSS
    let os = '';
    for (const [re, label] of platforms) {
      if (re.test(ua)) { os = label; break; }
    }
    return os ? name + ' · ' + os : name;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function buildRow(entry) {
    const outcome = OUTCOMES[entry.outcome] || null;
    const row = el('div', 'history-row');

    // Timestamp column sits nearest the rail: the rail is the timeline.
    const when = el('div', 'history-when');
    const ts = typeof entry.ts === 'number' ? entry.ts : Number(entry.ts);
    when.appendChild(el('span', 'history-time', formatWhen(ts)));
    const rel = relativeTime(ts);
    if (rel) when.appendChild(el('span', 'history-rel', rel));
    row.appendChild(when);

    const badge = el('span', 'badge ' + (outcome || 'unknown'), outcome || 'unknown');
    row.appendChild(badge);

    const meta = el('div', 'history-meta');
    // Meta order: user · ip · browser. Old rows have no "user" — omit the
    // span and its separator entirely so they render exactly as before.
    if (entry.user) {
      const userEl = el('span', 'history-user', String(entry.user));
      userEl.title = String(entry.user);   // property assignment, not markup
      meta.appendChild(userEl);
      meta.appendChild(el('span', 'history-sep', '·'));
    }
    const ip = entry.ip ? String(entry.ip) : 'unknown IP';
    meta.appendChild(el('span', 'history-ip', ip));
    meta.appendChild(el('span', 'history-sep', '·'));

    const ua = entry.user_agent ? String(entry.user_agent) : '';
    const uaEl = el('span', 'history-ua', shortUA(ua));
    uaEl.title = ua || 'No User-Agent sent';   // property assignment, not markup
    meta.appendChild(uaEl);
    row.appendChild(meta);

    if (entry.error) {
      row.appendChild(el('div', 'history-err', String(entry.error)));
    }
    return row;
  }

  function renderHistory(entries) {
    clear(historyList);
    historyError.classList.remove('show');

    if (!entries.length) {
      historyEmpty.classList.add('show');
      historyCount.textContent = '';
      return;
    }
    historyEmpty.classList.remove('show');
    historyCount.textContent = entries.length === 1
      ? '1 press'
      : entries.length + ' presses';

    const frag = document.createDocumentFragment();
    for (const entry of entries) {
      if (entry && typeof entry === 'object') frag.appendChild(buildRow(entry));
    }
    historyList.appendChild(frag);
  }

  async function refreshHistory() {
    try {
      const r = await fetch('/api/history?limit=50');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      renderHistory(Array.isArray(d.entries) ? d.entries : []);
    } catch (_) {
      // Quiet failure: leave whatever is already rendered, just flag it.
      historyEmpty.classList.remove('show');
      historyError.classList.add('show');
    }
  }

  refreshHistory();

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    statusMsg.textContent = '';

    // Sonar bloom from the button center; field surges then settles.
    const rect = btn.getBoundingClientRect();
    window.Jellyfield?.pulse(rect.left + rect.width / 2, rect.top + rect.height / 2, 2.4);
    window.Jellyfield?.setActivity(1);
    setTimeout(() => {
      window.Jellyfield?.setActivity(cooldownActive ? 0.25 : 0);
    }, 4000);

    try {
      const r = await fetch('/api/scan', { method: 'POST' });
      const d = await r.json();
      if (r.status === 429) {
        startCooldown(d.remaining_ms);
        return;
      }
      if (d.error) throw new Error(d.error);

      statusMsg.textContent = 'Scan started.';
      startCooldown(60 * 60 * 1000);
    } catch (e) {
      statusMsg.textContent = 'Error: ' + e.message;
      statusMsg.className = 'error';
      btn.disabled = false;
    } finally {
      // Every press is recorded server-side: started, cooldown AND error.
      refreshHistory();
    }
  });
</script>
</body>
</html>
