<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jellyfin Manager — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --abyss:   #040A12;
    --column:  #08182B;
    --brand:   #00A4DC;
    --medusa:  #A65CC7;
    --lumen:   #4CF2C7;
    --lantern: #FFC069;
    --coral:   #FF6B7A;
    --foam:    #EAF4FF;
    --benthos: #7C93B8;

    --font-display: 'Bricolage Grotesque', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body:    'Instrument Sans', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono:    'Spline Sans Mono', ui-monospace, Menlo, Consolas, monospace;

    --rail-line: rgba(140, 180, 235, 0.22);
    --rail-tick: rgba(140, 180, 235, 0.38);
  }

  html { color-scheme: dark; }

  body {
    font-family: var(--font-body);
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, var(--column) 0%, var(--abyss) 62%) fixed var(--abyss);
    color: var(--foam);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- The water ---- */

  #jellyfield {
    position: fixed;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(110% 70% at 50% -12%, rgba(130, 195, 255, 0.09), transparent 58%),
      radial-gradient(140% 140% at 50% 50%, transparent 52%, rgba(1, 4, 8, 0.6) 100%);
  }

  /* ---- Depth rail column ---- */

  .column {
    position: relative;
    z-index: 2;
    max-width: 600px;
    min-height: 100vh;
    margin-left: clamp(1.5rem, 14vw, 16rem);
    padding: 17vh 1.5rem 4rem 2.75rem;
    display: flex;
    flex-direction: column;
    gap: 2.25rem;
  }

  .rail {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--rail-line);
  }
  .rail::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 8px;
    background: repeating-linear-gradient(
      180deg,
      var(--rail-tick) 0 1px,
      transparent 1px 64px
    );
  }

  .eyebrow {
    font-family: var(--font-body);
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--benthos);
  }

  .rail-mark {
    position: absolute;
    left: -2.75rem;
    top: -1.9rem;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-size: 0.62rem;
  }
  .rail-mark::before {
    content: "";
    width: 16px;
    height: 1px;
    background: var(--rail-tick);
  }

  /* ---- Brand block ---- */

  .brand {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }

  .brand-glyph {
    flex: none;
    width: 40px;
    height: 40px;
    filter: drop-shadow(0 0 10px rgba(166, 92, 199, 0.35));
  }

  .wordmark {
    font-family: var(--font-display);
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    background: linear-gradient(100deg, var(--brand) 10%, var(--medusa) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .brand-eyebrow { margin-top: 0.3rem; }

  /* ---- Glass card ---- */

  .card {
    position: relative;
    /* Opaque enough (WCAG 1.4.3) that a bright bell drifting behind the glass
       can't pull small benthos text below 4.5:1. */
    background: rgba(10, 24, 43, 0.85);
    -webkit-backdrop-filter: blur(16px) saturate(1.25);
    backdrop-filter: blur(16px) saturate(1.25);
    border: 1px solid rgba(140, 180, 235, 0.16);
    border-radius: 16px;
    padding: 1.9rem 2rem 1.75rem;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.06),
      0 24px 60px rgba(0, 0, 0, 0.45),
      0 0 48px rgba(0, 90, 150, 0.12);
  }

  .card-eyebrow { margin-bottom: 1.15rem; }

  form .stack {
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    background: rgba(5, 14, 26, 0.62);
    border: 1px solid rgba(140, 180, 235, 0.2);
    border-radius: 10px;
    color: var(--foam);
    font-family: var(--font-body);
    font-size: 1rem;
    padding: 0.78rem 1rem;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  input[type="text"]::placeholder,
  input[type="password"]::placeholder { color: var(--benthos); }
  input[type="text"]:focus,
  input[type="text"]:focus-visible,
  input[type="password"]:focus,
  input[type="password"]:focus-visible {
    border-color: var(--brand);
    box-shadow:
      0 0 0 3px rgba(0, 164, 220, 0.18),
      0 0 22px rgba(0, 164, 220, 0.28);
  }

  button[type="submit"] {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 0.85rem 1rem;
    cursor: pointer;
    font-family: var(--font-display);
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #041019;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 45%),
      var(--brand);
    box-shadow:
      0 0 26px rgba(0, 164, 220, 0.35),
      0 4px 18px rgba(0, 0, 0, 0.4);
    transition: filter 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
  }
  button[type="submit"]:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
    box-shadow:
      0 0 38px rgba(0, 164, 220, 0.5),
      0 6px 20px rgba(0, 0, 0, 0.42);
  }
  button[type="submit"]:active { transform: translateY(0); filter: brightness(0.97); }
  button[type="submit"]:focus-visible {
    outline: 2px solid var(--lumen);
    outline-offset: 3px;
  }

  .hint {
    margin-top: 1.15rem;
    font-size: 0.8rem;
    color: var(--benthos);
  }

  .error {
    font-size: 0.84rem;
    color: var(--coral);
  }

  /* ---- Lockout ---- */

  .lockout {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    text-align: center;
    padding: 0.5rem 0 0.25rem;
  }

  .lockout-label { color: var(--coral); }

  #timer {
    font-family: var(--font-mono);
    font-size: 3.4rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.03em;
    color: var(--coral);
    text-shadow:
      0 0 18px rgba(255, 107, 122, 0.45),
      0 0 46px rgba(255, 107, 122, 0.2);
  }

  .lockout-msg {
    font-size: 0.8rem;
    color: var(--benthos);
  }

  /* ---- Shake ---- */

  @keyframes shake {
    0%   { transform: translateX(0); }
    15%  { transform: translateX(-8px); }
    30%  { transform: translateX(8px); }
    45%  { transform: translateX(-6px); }
    60%  { transform: translateX(6px); }
    75%  { transform: translateX(-3px); }
    90%  { transform: translateX(3px); }
    100% { transform: translateX(0); }
  }
  .shake { animation: shake 0.5s ease; }

  /* ---- Mobile ---- */

  @media (max-width: 720px) {
    .column {
      margin: 0 auto;
      max-width: 100%;
      padding: 12vh 1.25rem 3rem;
      gap: 1.75rem;
    }
    .rail, .rail-mark { display: none; }
    .card {
      border-left: 2px solid rgba(140, 180, 235, 0.18);
      padding: 1.6rem 1.4rem 1.5rem;
    }
  }

  /* ---- Reduced motion: hard floor ---- */

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    button[type="submit"]:hover { transform: none; }
  }
</style>
</head>
<body>

<canvas id="jellyfield" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<main class="column">
  <div class="rail" aria-hidden="true"></div>

  <header class="brand">
    <span class="rail-mark eyebrow" aria-hidden="true">Surface</span>
    <svg class="brand-glyph" viewBox="0 0 48 48" fill="none" role="img" aria-label="Jellyfin Manager">
      <defs>
        <linearGradient id="jgrad" x1="8" y1="8" x2="40" y2="42" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#A65CC7"/>
          <stop offset="1" stop-color="#00A4DC"/>
        </linearGradient>
      </defs>
      <path d="M9 23c0-9.4 6.9-15.5 15-15.5S39 13.6 39 23c0 2.8-4.2 4.6-15 4.6S9 25.8 9 23Z"
            stroke="url(#jgrad)" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M16 30c-1.2 3.8 1.8 6-1 10.5" stroke="url(#jgrad)" stroke-width="2" stroke-linecap="round"/>
      <path d="M24 31c0 4.6-2 6.8 0 11.5" stroke="url(#jgrad)" stroke-width="2" stroke-linecap="round"/>
      <path d="M32 30c1.2 3.8-1.8 6 1 10.5" stroke="url(#jgrad)" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="wordmark">Jellyfin Manager</div>
      <div class="eyebrow brand-eyebrow">Library sonar</div>
    </div>
  </header>

  <section class="card">
    {% if locked %}
    <div class="lockout">
      <div class="eyebrow lockout-label">Too many attempts. Try again in</div>
      <div id="timer">--:--</div>
      <div class="lockout-msg">The hatch unlocks automatically.</div>
      <noscript><div class="lockout-msg">JavaScript is off — refresh this page to check.</div></noscript>
    </div>
    <script>
      let remaining = {{ locked_seconds }};
      const timerEl = document.getElementById('timer');

      function pad(n) { return String(n).padStart(2, '0'); }
      function fmt(s) {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return pad(m) + ':' + pad(sec);
      }

      timerEl.textContent = fmt(remaining);
      const iv = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(iv);
          location.reload();
        } else {
          timerEl.textContent = fmt(remaining);
        }
      }, 1000);
    </script>

    {% else %}
    <div class="eyebrow card-eyebrow">Access console</div>
    <form method="POST" action="/login">
      <div class="stack">
        <label class="sr-only" for="username">Jellyfin username</label>
        <input type="text" id="username" name="username" placeholder="Jellyfin username" autofocus autocomplete="username" />
        <label class="sr-only" for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" />
        <button type="submit">Enter</button>
        {% if error %}
        <div class="error">{{ error }}</div>
        <script>
          const card = document.querySelector('.card');
          card.classList.add('shake');
          card.addEventListener('animationend', () => card.classList.remove('shake'), { once: true });
        </script>
        {% endif %}
      </div>
    </form>
    <div class="hint">Sign in with your Jellyfin account. The hatch locks after too many failed attempts.</div>
    {% endif %}
  </section>
</main>

<script src="{{ url_for('static', filename='jellyfield.js') }}"></script>
<script>
  (function () {
    'use strict';
    var canvas = document.getElementById('jellyfield');
    if (canvas) { window.Jellyfield?.mount(canvas); }
    document.addEventListener('click', function (e) {
      window.Jellyfield?.pulse(e.clientX, e.clientY);
    });
  })();
</script>

</body>
</html>
